<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>地牢密钥 · 浏览器预览</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1e33; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  /* 尺寸与旋转由 src/platform.js 按 innerWidth/innerHeight 设置（不用 100vh：手机浏览器里 100vh 比可视区高） */
  #game { display: block; position: fixed; left: 0; top: 0; transform-origin: 0 0; touch-action: none; }
</style>
</head>
<body>
<script src="../js/bundle.js"></script>
</body>
</html>
